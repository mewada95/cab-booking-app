<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MakeTripzy - Partner Dispatch Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

  <!-- TOP BAR -->
  <header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-md">
    <div class="flex items-center gap-2">
      <div class="bg-amber-500 text-slate-900 p-1.5 rounded-lg flex items-center justify-center font-bold">
        <i class="fa-solid fa-taxi text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide">MakeTripzy Partner</h1>
        <p class="text-[10px] text-slate-400">Live Driver & Vendor Radar</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 text-[11px] bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Radar Active
      </span>
    </div>
  </header>

  <!-- DRIVER PROFILE INPUT -->
  <div class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div class="flex-1">
        <p class="text-[10px] uppercase font-bold text-slate-400">Your Driver Name</p>
        <input id="partnerDriverName" type="text" value="Rajesh Sharma" class="w-full text-xs font-bold text-slate-800 border-b border-dashed border-slate-300 focus:outline-none focus:border-blue-500 py-0.5" />
      </div>
      <div class="flex-1 text-right">
        <p class="text-[10px] uppercase font-bold text-slate-400">Cab / Taxi Number</p>
        <input id="partnerCabNumber" type="text" value="MP 04 CZ 4589" class="w-full text-xs font-mono font-bold text-slate-800 border-b border-dashed border-slate-300 focus:outline-none focus:border-blue-500 text-right uppercase py-0.5" />
      </div>
    </div>
  </div>

  <!-- MAIN LIST CONTAINER -->
  <main class="max-w-md mx-auto p-4 pb-20">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Live Ride Requests</h2>
      <span id="bookingCount" class="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded-md">Connecting...</span>
    </div>

    <!-- LIVE BOOKINGS CARDS -->
    <div id="bookingsList" class="space-y-4">
      <div class="text-center py-12 text-slate-400 text-xs">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-slate-300"></i>
        <p>Connecting to MakeTripzy Live Firestore...</p>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAaHO2PxI2e_C82sN7lX3SIsobUWcKGVsQ",
      authDomain: "maketripzy.firebaseapp.com",
      projectId: "maketripzy",
      storageBucket: "maketripzy.firebasestorage.app",
      messagingSenderId: "484778826837",
      appId: "1:484778826837:web:b9652dbd1fee4c1ccd08dc",
      measurementId: "G-ZBZZHGGTQX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Listen to real-time rides from Firestore
    db.collection("bookings")
      .orderBy("createdAt", "desc")
      .onSnapshot((snapshot) => {
        const container = document.getElementById("bookingsList");
        const countBadge = document.getElementById("bookingCount");

        if (snapshot.empty) {
          container.innerHTML = `
            <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6 text-slate-400">
              <i class="fa-regular fa-clock text-3xl mb-2 text-slate-300"></i>
              <p class="text-xs font-semibold">Abhi koi live booking nahi hai.</p>
              <p class="text-[11px] mt-1 text-slate-400">Customer jab ride book karega, yahan turant alert aayega.</p>
            </div>`;
          countBadge.innerText = "0 Rides";
          return;
        }

        countBadge.innerText = `${snapshot.size} Active`;
        let html = "";

        snapshot.forEach((doc) => {
          const b = doc.data();
          const docId = doc.id;

          // 15% Platform Commission Model
          const totalFare = Number(b.total) || 1500;
          const commission15 = Math.round(totalFare * 0.15);
          const vendorNetEarning = totalFare - commission15;

          const isPending = b.status === "Confirmation Pending";
          const isConfirmed = b.status === "Confirmed";
          const isCancelled = b.status === "Cancelled";

          html += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border ${isCancelled ? 'border-rose-300 bg-rose-50/40' : isConfirmed ? 'border-emerald-300 bg-emerald-50/20' : 'border-amber-300'} text-xs space-y-3">
              
              <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <div>
                  <span class="font-bold font-mono text-slate-800 text-sm">${b.bookingId || docId.substring(0,8)}</span>
                  <span class="ml-1 text-[10px] text-slate-400">${b.date || ''} • ${b.time || ''}</span>
                </div>
                <span class="px-2.5 py-0.5 rounded-full font-bold text-[10px] ${
                  isConfirmed ? 'bg-emerald-100 text-emerald-800' :
                  isCancelled ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'
                }">
                  ${b.status}
                </span>
              </div>

              <div>
                <p class="text-[10px] uppercase font-bold text-slate-400">Route & Vehicle</p>
                <p class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                  ${b.from} <i class="fa-solid fa-arrow-right text-[10px] text-slate-400"></i> ${b.to}
                </p>
                <p class="text-[11px] text-blue-600 font-semibold mt-0.5">${b.vehicle} • ${b.type || 'One Way'}</p>
              </div>

              <div class="bg-slate-50 p-2.5 rounded-xl flex justify-between items-center">
                <div>
                  <p class="text-[10px] text-slate-400 uppercase font-bold">Passenger</p>
                  <p class="font-bold text-slate-800">${b.name}</p>
                  <p class="text-[10px] text-slate-500">${b.phone}</p>
                </div>
                <div class="text-right text-[11px]">
                  <p class="text-slate-400 text-[10px] uppercase font-bold">Landmark</p>
                  <p class="text-slate-600">${b.landmark || 'Direct Pickup'}</p>
                </div>
              </div>

              <!-- 15% Commission & Net Calculation -->
              <div class="bg-amber-50 border border-amber-200 rounded-xl p-2.5 space-y-1">
                <div class="flex justify-between text-slate-600 text-[11px]">
                  <span>Customer Total Fare:</span>
                  <span class="font-semibold">₹${totalFare}</span>
                </div>
                <div class="flex justify-between text-rose-600 text-[11px]">
                  <span>MakeTripzy Fee (15%):</span>
                  <span class="font-semibold">- ₹${commission15}</span>
                </div>
                <div class="flex justify-between text-emerald-700 font-bold text-xs pt-1 border-t border-amber-200">
                  <span>Vendor Net Payout:</span>
                  <span>₹${vendorNetEarning}</span>
                </div>
              </div>

              <!-- Action Buttons -->
              ${isPending ? `
                <button onclick="acceptBooking('${docId}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs flex items-center justify-center gap-1.5">
                  <i class="fa-solid fa-check"></i> Accept This Ride
                </button>
              ` : isConfirmed ? `
                <div class="p-2 bg-emerald-50 border border-emerald-200 rounded-xl text-center text-[11px] text-emerald-800 font-semibold">
                  Assigned Driver: <b>${b.driverName || 'You'}</b> | Cab: <b>${b.cabNumber || 'Assigned'}</b>
                </div>
              ` : `
                <div class="p-2 bg-rose-100 rounded-xl text-center text-[11px] text-rose-800 font-bold flex items-center justify-center gap-1">
                  <i class="fa-solid fa-triangle-exclamation"></i> Ride Cancelled by Customer (Do Not Dispatch)
                </div>
              `}
            </div>
          `;
        });

        container.innerHTML = html;
      });

    // Accept Ride Function
    function acceptBooking(docId) {
      const driverName = document.getElementById("partnerDriverName").value.trim();
      const cabNumber = document.getElementById("partnerCabNumber").value.trim();

      if (!driverName || !cabNumber) {
        alert("Kripya Driver Name aur Cab Number daalein!");
        return;
      }

      db.collection("bookings").doc(docId).update({
        status: "Confirmed",
        driverName: driverName,
        cabNumber: cabNumber,
        acceptedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("Ride accepted! Customer ki screen par aapki cab details live pahunch gayi hain.");
      }).catch(err => {
        alert("Error: " + err.message);
      });
    }
  </script>
</body>
</html>
